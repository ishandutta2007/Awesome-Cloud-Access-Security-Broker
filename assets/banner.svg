<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 38px;
      fill: #ffffff;
    }
    .title-highlight {
      fill: #a5b4fc;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #cbd5e1;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
  </style>

  <!-- Base Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="350" rx="16" fill="url(#grid)"/>

  <!-- Static Decorative Orbs -->
  <circle cx="150" cy="100" r="100" fill="#818cf8" opacity="0.12"/>
  <circle cx="1050" cy="250" r="120" fill="#c084fc" opacity="0.1"/>

  <!-- Decorative Shield Icon (Left Side) -->
  <g transform="translate(70, 110)">
    <path d="M 40 0 L 80 20 V 60 C 80 90 40 110 40 110 C 40 110 0 90 0 60 V 20 Z" fill="none" stroke="#818cf8" stroke-width="3.5"/>
    <path d="M 40 10 L 70 26 V 58 C 70 82 40 98 40 98 C 40 98 10 82 10 58 V 26 Z" fill="url(#shieldGrad)" opacity="0.3"/>
    <path d="M 28 52 L 36 60 L 52 42" fill="none" stroke="#38bdf8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Main Content -->
  <g transform="translate(180, 130)">
    <!-- Header Title -->
    <text x="0" y="20" class="title">
      Awesome Cloud Access Security Broker <tspan class="title-highlight">(CASB)</tspan>
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="58" class="subtitle">
      Curated Landscape of SaaS Security Posture, DLP, Shadow IT &amp; Enterprise Security Platforms
    </text>

    <!-- Feature Pills / Badges in Banner -->
    <g transform="translate(0, 85)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#34d399"/>
      <text x="30" y="21" class="badge-text">SaaS Posture (SSPM)</text>

      <!-- Pill 2 -->
      <rect x="177" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="193" cy="16" r="5" fill="#38bdf8"/>
      <text x="207" y="21" class="badge-text">Shadow IT Discovery</text>

      <!-- Pill 3 -->
      <rect x="364" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="380" cy="16" r="5" fill="#f43f5e"/>
      <text x="394" y="21" class="badge-text">Data Loss Prevention</text>

      <!-- Pill 4 -->
      <rect x="551" y="0" width="175" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="567" cy="16" r="5" fill="#fbbf24"/>
      <text x="581" y="21" class="badge-text">Open-Source Engines</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect width="1200" height="350" rx="16" fill="none" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.4"/>
</svg>
