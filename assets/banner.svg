<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#6366f1" stroke-width="0.5" stroke-opacity="0.15"/>
    </pattern>

    <!-- Glowing effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="textGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 18px;
      fill: #a5b4fc;
    }
    .badge-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e0e7ff;
    }
    
    /* Animations */
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-15px) rotate(180deg); }
      100% { transform: translateY(0px) rotate(360deg); }
    }
    @keyframes dashStream {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }

    .pulse-bg {
      animation: pulseGlow 6s ease-in-out infinite;
      transform-origin: center;
    }
    .particle {
      animation: floatParticle 8s ease-in-out infinite;
      transform-origin: center;
    }
    .stream-line {
      stroke-dasharray: 10, 15;
      animation: dashStream 3s linear infinite;
    }
  </style>

  <!-- Base Layer -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="350" rx="16" fill="url(#grid)"/>

  <!-- Dynamic Animated Background Orbs (Kept subtle behind text) -->
  <circle cx="200" cy="100" r="120" fill="#818cf8" opacity="0.15" class="pulse-bg" filter="url(#glow)"/>
  <circle cx="1000" cy="250" r="140" fill="#c084fc" opacity="0.12" class="pulse-bg" filter="url(#glow)"/>
  <circle cx="600" cy="175" r="180" fill="#38bdf8" opacity="0.08" class="pulse-bg" filter="url(#glow)"/>

  <!-- Dynamic Security Stream Nodes & Lines (Background Graphic Elements) -->
  <g stroke="#818cf8" stroke-opacity="0.3" stroke-width="2">
    <line x1="100" y1="280" x2="300" y2="280" class="stream-line"/>
    <line x1="900" y1="70" x2="1100" y2="70" class="stream-line"/>
  </g>

  <!-- Decorative Shield Icon (Left Side) -->
  <g transform="translate(80, 105)" filter="url(#glow)">
    <path d="M 40 0 L 80 20 V 60 C 80 90 40 110 40 110 C 40 110 0 90 0 60 V 20 Z" fill="none" stroke="#818cf8" stroke-width="4"/>
    <path d="M 40 10 L 70 26 V 58 C 70 82 40 98 40 98 C 40 98 10 82 10 58 V 26 Z" fill="#6366f1" opacity="0.3"/>
    <path d="M 30 50 L 38 58 L 54 40" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Foreground Main Content (Prominent & Clear Title/Subtitle) -->
  <g transform="translate(190, 135)">
    <!-- Header Title -->
    <text x="0" y="0" class="title" filter="url(#textGlow)">
      Awesome Cloud Access Security Broker <tspan fill="#818cf8">(CASB)</tspan> 🛡️
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="38" class="subtitle">
      Curated Landscape of SaaS Security Posture, DLP, Shadow IT & Enterprise Security Platforms
    </text>

    <!-- Feature Pills / Badges in Banner -->
    <g transform="translate(0, 65)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="150" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="16" cy="16" r="5" fill="#34d399"/>
      <text x="30" y="21" class="badge-text">SaaS Posture (SSPM)</text>

      <!-- Pill 2 -->
      <rect x="162" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="178" cy="16" r="5" fill="#38bdf8"/>
      <text x="192" y="21" class="badge-text">Shadow IT Discovery</text>

      <!-- Pill 3 -->
      <rect x="339" y="0" width="160" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="355" cy="16" r="5" fill="#f43f5e"/>
      <text x="369" y="21" class="badge-text">Data Loss Prevention</text>

      <!-- Pill 4 -->
      <rect x="511" y="0" width="165" height="32" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
      <circle cx="527" cy="16" r="5" fill="#fbbf24"/>
      <text x="541" y="21" class="badge-text">Open-Source Engines</text>
    </g>
  </g>

  <!-- Border Frame -->
  <rect width="1200" height="350" rx="16" fill="none" stroke="#4f46e5" stroke-width="2" stroke-opacity="0.4"/>
</svg>
